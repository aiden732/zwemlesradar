name: Dagelijkse wachttijd-scrape
on:
  schedule:
    - cron: "0 5 * * *"   # elke ochtend 05:00 UTC (07:00 NL)
  workflow_dispatch:        # + handmatig startbaar via de Actions-tab
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests beautifulsoup4
      - run: python run.py
      - name: Commit nieuwe data
        run: |
          git config user.name "zwemlesradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/wachttijden.json
          git diff --cached --quiet || git commit -m "data: wachttijden $(date +%F)"
          git push
